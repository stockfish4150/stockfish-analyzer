<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Chess Analyzer</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #161512;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .config-box {
            width: 780px;
            max-width: 100%;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
        }

        .config-box input {
            flex: 1;
            background-color: #21201d;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .config-box button {
            background-color: #81b64c;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .config-box button:hover {
            background-color: #95cc5b;
        }

        .panel-container {
            width: 780px;
            max-width: 100%;
            background-color: #21201d;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background-color: #21201d;
            flex-wrap: wrap;
            gap: 12px;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            background-color: #2d2b27;
            color: #bababa;
            width: 28px;
            height: 28px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .engine-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .engine-speed {
            background-color: #2d2b27;
            color: #b0b0b0;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-family: monospace;
        }

        .right-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8b8984;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            font-family: monospace;
        }

        .progress-timeline {
            width: 100%;
            height: 3px;
            background-color: #2d2b27;
        }

        .progress-timeline-fill {
            height: 100%;
            width: 0%;
            background-color: #3880b6;
            transition: width 0.08s linear;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background-color: #1a1916;
            border-top: 1px solid #252420;
        }

        .eval-badge {
            background-color: #ffffff;
            color: #161512;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 3px;
            min-width: 48px;
            text-align: center;
            margin-right: 14px;
            font-family: monospace;
        }

        .moves-line {
            font-size: 0.9rem;
            color: #c3c2c0;
            overflow-x: auto;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            padding-bottom: 4px;
        }

        .moves-line .move-num {
            color: #62615e;
            font-weight: 700;
            margin-right: 4px;
        }

        .moves-line .move-str {
            color: #ffffff;
            font-weight: 600;
            margin-right: 12px;
        }

        .settings-container {
            width: 780px;
            max-width: 100%;
            margin-bottom: 12px;
            background-color: #21201d;
            border-radius: 4px;
            padding: 12px 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
        }

        .custom-select {
            background-color: #161512;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #161512;
            border: 1px solid #3d3b36;
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 10;
            display: none;
        }

        .custom-options.open {
            display: block;
        }

        .custom-option {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #2d2b27;
        }

        .custom-option:last-child {
            border-bottom: none;
        }

        .custom-option:hover {
            background-color: #2d2b27;
        }

        .settings-grid {
            display: none; 
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-item label {
            font-size: 0.75rem;
            color: #8b8984;
            font-weight: 700;
        }

        .setting-item input[type="number"],
        .setting-item select {
            background-color: #161512;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        .setting-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #ffffff;
            height: 100%;
            padding-top: 18px; 
            cursor: pointer;
        }

        .moves-line::-webkit-scrollbar {
            height: 6px;
        }
        .moves-line::-webkit-scrollbar-track {
            background: #1a1916;
            border-radius: 3px;
        }
        .moves-line::-webkit-scrollbar-thumb {
            background: #3d3b36;
            border-radius: 3px;
        }
        .moves-line::-webkit-scrollbar-thumb:hover {
            background: #62615e;
        }
        
        @media (max-width: 600px) {
            .config-box {
                flex-direction: column;
            }
            
            .config-box button {
                padding: 12px 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="config-box">
    <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
    <button onclick="requestAnalysis()">분석</button>
</div>

<div class="settings-container">
    <div class="custom-select-wrapper">
        <div class="custom-select" onclick="if(event.target.id !== 'settings-btn') toggleDropdown()">
            <span id="selected-preset">선택</span>
            <div>
                <span id="settings-btn" style="display: none; cursor: pointer; margin-right: 8px;" onclick="toggleSettings()">⚙️</span>
                <span>▼</span>
            </div>
        </div>
        <div class="custom-options" id="preset-options">
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Zero')">Stockfish 19 Zero</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Instant')">Stockfish 19 Instant</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Fast')">Stockfish 19 Fast</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Lite')">Stockfish 19 Lite</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Plus')">Stockfish 19 Plus</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Pro')">Stockfish 19 Pro</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Ultra')">Stockfish 19 Ultra</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Max')">Stockfish 19 Max</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Infinity')">Stockfish 19 Infinity</div>
            <div class="custom-option" onclick="applyPreset('Custom')">Custom</div>
        </div>
    </div>

    <div class="settings-grid" id="settings-grid-panel">
        <div class="setting-item">
            <label>Threads</label>
            <input type="number" id="opt-threads" value="1">
        </div>
        <div class="setting-item">
            <label>Hash</label>
            <input type="number" id="opt-hash" value="16">
        </div>
        <div class="setting-item">
            <label>Skill Level</label>
            <input type="number" id="opt-skill" value="20">
        </div>
        <div class="setting-item">
            <label>Move Overhead</label>
            <input type="number" id="opt-overhead" value="10">
        </div>
        
        <div class="setting-item" style="grid-column: span 2;">
            <label>Limit</label>
            <div style="display: flex; gap: 8px;">
                <select id="opt-limit-type" onchange="syncLimitToHidden()" style="flex: 1;">
                    <option value="time">Time</option>
                    <option value="depth" selected>Depth</option>
                    <option value="nodes">Nodes</option>
                    <option value="infinity">Infinite</option>
                </select>
                <input type="number" id="opt-limit-value" value="24" oninput="syncLimitToHidden()" style="flex: 1; min-width: 0;">
            </div>
        </div>
        
        <div class="setting-item">
            <label class="setting-checkbox">
                <input type="checkbox" id="opt-ponder"> Ponder
            </label>
        </div>
        
        <input type="hidden" id="opt-depth" value="24">
        <input type="hidden" id="opt-time" value="0">
        <input type="hidden" id="opt-nodes" value="0">
        <input type="checkbox" id="opt-infinity" style="display: none;">
    </div>
</div>

<div class="panel-container">
    <div class="top-row">
        <div class="left-controls">
            <div class="status-indicator" id="status-icon">■</div>
            <div class="engine-title">Stockfish 19</div>
        </div>
        <div class="right-stats">
            <div class="stat-item">
                <span class="stat-label">EVAL</span>
                <span class="stat-value" id="stat-eval">0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DEPTH</span>
                <span class="stat-value" id="stat-depth">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">NODES</span>
                <span class="stat-value" id="stat-nodes">0.00M</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">NPS</span>
                <span class="stat-value" id="stat-nps">0.0 Mn/s</span>
            </div>
        </div>
    </div>

    <div class="progress-timeline">
        <div id="fill-line" class="progress-timeline-fill"></div>
    </div>

    <div class="bottom-row">
        <div class="eval-badge" id="badge-eval">0.00</div>
        <div class="moves-line" id="moves-output">Engine loaded!</div>
    </div>
</div>

<script>
    const socket = io("https://stockfish-analyzer.serveousercontent.com", { transports: ['websocket'] });
    
    let TARGET_DEPTH = 20;
    let currentMaxDepth = 0;
    let currentBestPvLength = 0;

    function requestAnalysis() {
        const fen = document.getElementById('fen-input').value;
        TARGET_DEPTH = parseInt(document.getElementById('opt-depth').value) || 20;
        
        currentMaxDepth = 0;
        currentBestPvLength = 0;
        
        document.getElementById('status-icon').innerText = "■";
        document.getElementById('status-icon').style.color = "#81b64c";
        document.getElementById('fill-line').style.width = '0%';
        document.getElementById('moves-output').innerText = "Analyzing...";

        const analysisOptions = {
            fen: fen,
            targetDepth: TARGET_DEPTH,
            threads: parseInt(document.getElementById('opt-threads').value),
            hash: parseInt(document.getElementById('opt-hash').value),
            skillLevel: parseInt(document.getElementById('opt-skill').value),
            moveOverhead: parseInt(document.getElementById('opt-overhead').value),
            time: parseInt(document.getElementById('opt-time').value),
            nodes: parseInt(document.getElementById('opt-nodes').value),
            ponder: document.getElementById('opt-ponder').checked,
            infinity: document.getElementById('opt-infinity').checked
        };

        socket.emit('start-analysis', analysisOptions);
    }

    socket.on('analysis-progress', (data) => {
        if (!data) return;

        const newDepth = parseInt(data.depth) || 0;
        const newPvArray = data.pv ? (Array.isArray(data.pv) ? data.pv : String(data.pv).trim().split(/\s+/)) : [];

        if (newDepth > 0) {
            if (newDepth < currentMaxDepth) {
                return;
            }
            if (newDepth === currentMaxDepth && newPvArray.length <= 2 && currentBestPvLength > 2) {
                return;
            }

            if (newDepth > currentMaxDepth) {
                currentMaxDepth = newDepth;
                currentBestPvLength = newPvArray.length;
            } else {
                currentBestPvLength = Math.max(currentBestPvLength, newPvArray.length);
            }
        }

        const progressPercent = Math.min(Math.round((data.depth / TARGET_DEPTH) * 100), 100);
        document.getElementById('fill-line').style.width = progressPercent + '%';
        
        document.getElementById('stat-depth').innerText = data.depth || 0;
        
        const nodesVal = data.nodes ? (data.nodes / 1000000).toFixed(2) : "0.00";
        document.getElementById('stat-nodes').innerText = nodesVal + 'M';

        const npsVal = data.nps ? (data.nps / 1000000).toFixed(1) : "0.0";
        const statNps = document.getElementById('stat-nps');
        if (statNps) {
            statNps.innerText = npsVal + ' Mn/s';
        }

        let scoreStr = String(data.score || "0.00");
        if (scoreStr !== "0.00" && !scoreStr.startsWith('-') && !scoreStr.startsWith('M')) {
            scoreStr = '+' + scoreStr;
        }
        document.getElementById('stat-eval').innerText = scoreStr;
        document.getElementById('badge-eval').innerText = scoreStr;

        if (data.pv) {
            document.getElementById('moves-output').innerHTML = parsePvToHtml(data.pv);
        }
    });

    socket.on('analysis-complete', (data) => {
        document.getElementById('status-icon').innerText = "▶";
        document.getElementById('status-icon').style.color = "#bababa";
        document.getElementById('fill-line').style.width = '100%';
    });

    function parsePvToHtml(pvString) {
        if (!pvString) return "Analyzing...";
        const moves = Array.isArray(pvString) ? pvString : String(pvString).trim().split(/\s+/);
        let html = "";
        let moveNumber = 1;

        for (let i = 0; i < moves.length; i++) {
            if (i % 2 === 0) {
                html += `<span class="move-num">${moveNumber}.</span>`;
                moveNumber++;
            }
            html += `<span class="move-str">${moves[i]}</span>`;
        }
        return html;
    }

    const presets = {
        'Stockfish 19 Zero': { threads: 1, hash: 8, skill: 20, overhead: 0, depth: 3, time: 10, nodes: 0, ponder: false, infinity: false },
        'Stockfish 19 Instant': { threads: 1, hash: 16, skill: 20, overhead: 0, depth: 5, time: 100, nodes: 0, ponder: false, infinity: false },
        'Stockfish 19 Fast': { threads: 1, hash: 32, skill: 20, overhead: 5, depth: 10, time: 10000, nodes: 0, ponder: false, infinity: false },
        'Stockfish 19 Lite': { threads: 1, hash: 64, skill: 20, overhead: 5, depth: 10, time: 30000, nodes: 0, ponder: false, infinity: false },
        'Stockfish 19 Plus': { threads: 2, hash: 128, skill: 20, overhead: 10, depth: 15, time: 50000, nodes: 0, ponder: false, infinity: false },
        'Stockfish 19 Pro': { threads: 4, hash: 256, skill: 20, overhead: 15, depth: 20, time: 100000, nodes: 0, ponder: true, infinity: false },
        'Stockfish 19 Ultra': { threads: 8, hash: 512, skill: 20, overhead: 20, depth: 25, time: 200000, nodes: 0, ponder: true, infinity: false },
        'Stockfish 19 Max': { threads: 16, hash: 1024, skill: 20, overhead: 25, depth: 30, time: 300000, nodes: 0, ponder: true, infinity: false },
        'Stockfish 19 Infinity': { threads: 32, hash: 1024, skill: 20, overhead: 30, depth: 35, time: 600000, nodes: 0, ponder: true, infinity: true }
    };

    function toggleDropdown() {
        document.getElementById('preset-options').classList.toggle('open');
    }

    function toggleSettings() {
        const gridPanel = document.getElementById('settings-grid-panel');
        if (gridPanel.style.display === 'none' || gridPanel.style.display === '') {
            gridPanel.style.display = 'grid';
        } else {
            gridPanel.style.display = 'none';
        }
    }

    function syncLimitToHidden() {
        const limitType = document.getElementById('opt-limit-type').value;
        const limitValue = document.getElementById('opt-limit-value').value;
        const limitInput = document.getElementById('opt-limit-value');
        
        document.getElementById('opt-depth').value = 0;
        document.getElementById('opt-time').value = 0;
        document.getElementById('opt-nodes').value = 0;
        document.getElementById('opt-infinity').checked = false;

        if (limitType === 'infinity') {
            limitInput.style.display = 'none';
            document.getElementById('opt-infinity').checked = true;
        } else {
            limitInput.style.display = 'block';
            if (limitType === 'depth') document.getElementById('opt-depth').value = limitValue;
            if (limitType === 'time') document.getElementById('opt-time').value = limitValue;
            if (limitType === 'nodes') document.getElementById('opt-nodes').value = limitValue;
        }
    }

    function applyPreset(presetName) {
        document.getElementById('selected-preset').innerText = presetName;
        document.querySelector('.engine-title').innerText = presetName;
        
        const settingsBtn = document.getElementById('settings-btn');
        const gridPanel = document.getElementById('settings-grid-panel');

        if (presetName === 'Custom') {
            settingsBtn.style.display = 'inline-block';
        } else {
            settingsBtn.style.display = 'none';
            gridPanel.style.display = 'none';
            
            const config = presets[presetName];
            if (config) {
                document.getElementById('opt-threads').value = config.threads;
                document.getElementById('opt-hash').value = config.hash;
                document.getElementById('opt-skill').value = config.skill;
                document.getElementById('opt-overhead').value = config.overhead;
                document.getElementById('opt-depth').value = config.depth;
                document.getElementById('opt-time').value = config.time;
                document.getElementById('opt-nodes').value = config.nodes;
                document.getElementById('opt-ponder').checked = config.ponder;
                document.getElementById('opt-infinity').checked = config.infinity;
                
                if (config.infinity) {
                    document.getElementById('opt-limit-type').value = 'infinity';
                    document.getElementById('opt-limit-value').style.display = 'none';
                } else if (config.time > 0 && config.depth === 0) {
                    document.getElementById('opt-limit-type').value = 'time';
                    document.getElementById('opt-limit-value').value = config.time;
                    document.getElementById('opt-limit-value').style.display = 'block';
                } else if (config.nodes > 0) {
                    document.getElementById('opt-limit-type').value = 'nodes';
                    document.getElementById('opt-limit-value').value = config.nodes;
                    document.getElementById('opt-limit-value').style.display = 'block';
                } else {
                    document.getElementById('opt-limit-type').value = 'depth';
                    document.getElementById('opt-limit-value').value = config.depth;
                    document.getElementById('opt-limit-value').style.display = 'block';
                }
            }
        }
        document.getElementById('preset-options').classList.remove('open');
    }

    document.addEventListener('click', function(event) {
        const wrapper = document.querySelector('.custom-select-wrapper');
        if (wrapper && !wrapper.contains(event.target)) {
            const options = document.getElementById('preset-options');
            if (options && options.classList.contains('open')) {
                options.classList.remove('open');
            }
        }
    });
</script>
</body>
</html>
