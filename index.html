<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Chess Analyzer</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #161512;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .config-box {
            width: 780px;
            max-width: 100%;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
        }

        .config-box input {
            flex: 1;
            background-color: #21201d;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .config-box button {
            background-color: #81b64c;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .config-box button:hover {
            background-color: #95cc5b;
        }

        .panel-container {
            width: 780px;
            max-width: 100%;
            background-color: #21201d;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background-color: #21201d;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            background-color: #2d2b27;
            color: #bababa;
            width: 28px;
            height: 28px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .engine-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .engine-speed {
            background-color: #2d2b27;
            color: #b0b0b0;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-family: monospace;
        }

        .right-stats {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8b8984;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            font-family: monospace;
        }

        .progress-timeline {
            width: 100%;
            height: 3px;
            background-color: #2d2b27;
        }

        .progress-timeline-fill {
            height: 100%;
            width: 0%;
            background-color: #3880b6;
            transition: width 0.08s linear;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background-color: #1a1916;
            border-top: 1px solid #252420;
        }

        .eval-badge {
            background-color: #ffffff;
            color: #161512;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 3px;
            min-width: 48px;
            text-align: center;
            margin-right: 14px;
            font-family: monospace;
        }

        .moves-line {
            font-size: 0.9rem;
            color: #c3c2c0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .moves-line .move-num {
            color: #62615e;
            font-weight: 700;
            margin-right: 4px;
        }

        .moves-line .move-str {
            color: #ffffff;
            font-weight: 600;
            margin-right: 12px;
        }

        .settings-container {
            width: 780px;
            max-width: 100%;
            margin-bottom: 12px;
            background-color: #21201d;
            border-radius: 4px;
            padding: 12px 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
        }

        .custom-select {
            background-color: #161512;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #161512;
            border: 1px solid #3d3b36;
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 10;
            display: none;
        }

        .custom-options.open {
            display: block;
        }

        .custom-option {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #2d2b27;
        }

        .custom-option:last-child {
            border-bottom: none;
        }

        .custom-option:hover {
            background-color: #2d2b27;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-item label {
            font-size: 0.75rem;
            color: #8b8984;
            font-weight: 700;
        }

        .setting-item input[type="number"] {
            background-color: #161512;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        .setting-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #ffffff;
            height: 100%;
            padding-top: 18px; 
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="config-box">
    <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
    <button onclick="requestAnalysis()">분석</button>
</div>

<div class="settings-container">
    <div class="custom-select-wrapper">
        <div class="custom-select" onclick="toggleDropdown()">
            <span id="selected-preset">선택</span>
            <span>▼</span>
        </div>
        <div class="custom-options" id="preset-options">
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Fast Analyze')">Stockfish 19 Fast Analyze</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Max')">Stockfish 19 Max</div>
            <div class="custom-option" onclick="applyPreset('Stockfish 19 Instant')">Stockfish 19 Instant</div>
        </div>
    </div>

    <div class="settings-grid">
        <div class="setting-item">
            <label>Threads</label>
            <input type="number" id="opt-threads" value="1">
        </div>
        <div class="setting-item">
            <label>Hash</label>
            <input type="number" id="opt-hash" value="16">
        </div>
        <div class="setting-item">
            <label>Skill Level</label>
            <input type="number" id="opt-skill" value="20">
        </div>
        <div class="setting-item">
            <label>Move Overhead</label>
            <input type="number" id="opt-overhead" value="10">
        </div>
        <div class="setting-item">
            <label>Depth</label>
            <input type="number" id="opt-depth" value="24">
        </div>
        <div class="setting-item">
            <label>Time (ms)</label>
            <input type="number" id="opt-time" value="0">
        </div>
        <div class="setting-item">
            <label>Nodes</label>
            <input type="number" id="opt-nodes" value="0">
        </div>
        <div class="setting-item">
            <label class="setting-checkbox">
                <input type="checkbox" id="opt-ponder"> Ponder
            </label>
        </div>
        <div class="setting-item">
            <label class="setting-checkbox">
                <input type="checkbox" id="opt-infinity"> Infinity
            </label>
        </div>
    </div>
</div>

<div class="panel-container">
    <div class="top-row">
        <div class="left-controls">
            <div class="status-indicator" id="status-icon">■</div>
            <div class="engine-title">Stockfish 19</div>
            <div class="engine-speed" id="stat-nps">0.0 Mn/s</div>
        </div>
        <div class="right-stats">
            <div class="stat-item">
                <span class="stat-label">EVAL</span>
                <span class="stat-value" id="stat-eval">0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DEPTH</span>
                <span class="stat-value" id="stat-depth">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">NODES</span>
                <span class="stat-value" id="stat-nodes">0.00M</span>
            </div>
        </div>
    </div>

    <div class="progress-timeline">
        <div id="fill-line" class="progress-timeline-fill"></div>
    </div>

    <div class="bottom-row">
        <div class="eval-badge" id="badge-eval">0.00</div>
        <div class="moves-line" id="moves-output">Engine loaded!</div>
    </div>
</div>

<script>
    const socket = io("https://stockfish-analyzer.serveousercontent.com", { transports: ['websocket'] });
    
    let TARGET_DEPTH = 24;

    function requestAnalysis() {
        const fen = document.getElementById('fen-input').value;
        TARGET_DEPTH = parseInt(document.getElementById('opt-depth').value) || 24;
        
        document.getElementById('status-icon').innerText = "▶";
        document.getElementById('status-icon').style.color = "#81b64c";
        document.getElementById('fill-line').style.width = '0%';
        document.getElementById('moves-output').innerText = "수 연산 중...";

        const analysisOptions = {
            fen: fen,
            targetDepth: TARGET_DEPTH,
            threads: parseInt(document.getElementById('opt-threads').value),
            hash: parseInt(document.getElementById('opt-hash').value),
            skillLevel: parseInt(document.getElementById('opt-skill').value),
            moveOverhead: parseInt(document.getElementById('opt-overhead').value),
            time: parseInt(document.getElementById('opt-time').value),
            nodes: parseInt(document.getElementById('opt-nodes').value),
            ponder: document.getElementById('opt-ponder').checked,
            infinity: document.getElementById('opt-infinity').checked
        };

        socket.emit('start-analysis', analysisOptions);
    }

    socket.on('analysis-progress', (data) => {
        if (!data) return;

        const progressPercent = Math.min(Math.round((data.depth / TARGET_DEPTH) * 100), 100);
        document.getElementById('fill-line').style.width = progressPercent + '%';
        
        document.getElementById('stat-depth').innerText = data.depth || 0;
        
        const nodesVal = data.nodes ? (data.nodes / 1000000).toFixed(2) : "0.00";
        document.getElementById('stat-nodes').innerText = nodesVal + 'M';

        const npsVal = data.nps ? (data.nps / 1000000).toFixed(1) : "0.0";
        document.getElementById('stat-nps').innerText = npsVal + ' Mn/s';

        let scoreStr = data.score || "0.00";
        if (scoreStr !== "0.00" && !scoreStr.startsWith('-') && !scoreStr.startsWith('M')) {
            scoreStr = '+' + scoreStr;
        }
        document.getElementById('stat-eval').innerText = scoreStr;
        document.getElementById('badge-eval').innerText = scoreStr;

        if (data.pv) {
            document.getElementById('moves-output').innerHTML = parsePvToHtml(data.pv);
        }
    });

    socket.on('analysis-complete', (data) => {
        document.getElementById('status-icon').innerText = "■";
        document.getElementById('status-icon').style.color = "#bababa";
        document.getElementById('fill-line').style.width = '100%';
    });

    function parsePvToHtml(pvString) {
        if (!pvString) return "Analyzing...";
        const moves = pvString.trim().split(/\s+/);
        let html = "";
        let moveNumber = 1;

        for (let i = 0; i < moves.length; i++) {
            if (i % 2 === 0) {
                html += `<span class="move-num">${moveNumber}.</span>`;
                moveNumber++;
            }
            html += `<span class="move-str">${moves[i]}</span>`;
        }
        return html;
    }

    const presets = {
        'Stockfish 19 Analyze': { threads: 2, hash: 16, skill: 20, overhead: 10, depth: 18, time: 1000, nodes: 0, ponder: false, infinity: false },
        'Stockfish 19 Max': { threads: 8, hash: 1024, skill: 20, overhead: 10, depth: 30, time: 5000, nodes: 0, ponder: true, infinity: false },
        'Stockfish 19 Instant': { threads: 1, hash: 16, skill: 20, overhead: 10, depth: 12, time: 100, nodes: 0, ponder: false, infinity: false }
    };

    function toggleDropdown() {
        document.getElementById('preset-options').classList.toggle('open');
    }

    function applyPreset(presetName) {
        document.getElementById('selected-preset').innerText = presetName;
        const config = presets[presetName];
        if (config) {
            document.getElementById('opt-threads').value = config.threads;
            document.getElementById('opt-hash').value = config.hash;
            document.getElementById('opt-skill').value = config.skill;
            document.getElementById('opt-overhead').value = config.overhead;
            document.getElementById('opt-depth').value = config.depth;
            document.getElementById('opt-time').value = config.time;
            document.getElementById('opt-nodes').value = config.nodes;
            document.getElementById('opt-ponder').checked = config.ponder;
            document.getElementById('opt-infinity').checked = config.infinity;
        }
        document.getElementById('preset-options').classList.remove('open');
    }

    document.addEventListener('click', function(event) {
        const wrapper = document.querySelector('.custom-select-wrapper');
        if (wrapper && !wrapper.contains(event.target)) {
            const options = document.getElementById('preset-options');
            if (options && options.classList.contains('open')) {
                options.classList.remove('open');
            }
        }
    });
</script>
</body>
</html>
