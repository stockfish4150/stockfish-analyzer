<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Chess Analyzer</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #161512;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .config-box { width: 780px; max-width: 100%; margin-bottom: 12px; display: flex; gap: 8px; }
        .config-box input { flex: 1; background-color: #21201d; border: 1px solid #3d3b36; color: #ffffff; padding: 10px 14px; border-radius: 4px; font-size: 0.9rem; outline: none; }
        .panel-container { width: 780px; max-width: 100%; background-color: #21201d; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
        .top-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background-color: #21201d; flex-wrap: wrap; gap: 12px; }
        .left-controls { display: flex; align-items: center; gap: 12px; }
        .status-indicator { background-color: #2d2b27; color: #bababa; width: 28px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; }
        .engine-title { font-size: 0.95rem; font-weight: 700; color: #ffffff; }
        .right-stats { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-label { font-size: 0.65rem; color: #8b8984; font-weight: 700; letter-spacing: 0.5px; }
        .stat-value { font-size: 0.95rem; font-weight: 700; color: #ffffff; font-family: monospace; }
        .progress-timeline { width: 100%; height: 3px; background-color: #2d2b27; }
        .progress-timeline-fill { height: 100%; width: 0%; background-color: #3880b6; transition: width 0.08s linear; }
        @keyframes progress-flow { from { background-position: 16px 0; } to { background-position: 0 0; } }
        .progress-timeline-fill.analyzing { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent); background-size: 16px 16px; animation: progress-flow 1s linear infinite; }
        .bottom-row { display: flex; align-items: center; padding: 12px 14px; background-color: #1a1916; border-top: 1px solid #252420; }
        .eval-badge { background-color: #ffffff; color: #161512; font-weight: 800; font-size: 0.85rem; padding: 3px 8px; border-radius: 3px; min-width: 48px; text-align: center; margin-right: 14px; font-family: monospace; }
        .moves-line { font-size: 0.9rem; color: #c3c2c0; overflow-x: auto; white-space: nowrap; flex: 1; min-width: 0; padding-bottom: 4px; }
        .moves-line .move-num { color: #62615e; font-weight: 700; margin-right: 4px; }
        .moves-line .move-str { color: #ffffff; font-weight: 600; margin-right: 12px; }
        .settings-container { width: 780px; max-width: 100%; margin-bottom: 12px; background-color: #21201d; border-radius: 4px; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
        .custom-select-wrapper { position: relative; user-select: none; width: 100%; }
        .custom-select { background-color: #161512; border: 1px solid #3d3b36; color: #ffffff; padding: 10px 14px; border-radius: 4px; font-size: 0.9rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .custom-options { position: absolute; top: 100%; left: 0; right: 0; background-color: #161512; border: 1px solid #3d3b36; border-top: none; border-radius: 0 0 4px 4px; z-index: 10; display: none; }
        .custom-options.open { display: block; }
        .custom-option { padding: 10px 14px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #2d2b27; }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover:not(.disabled) { background-color: #2d2b27; }
        .settings-grid { display: none; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
        .setting-item { display: flex; flex-direction: column; gap: 6px; }
        .setting-item label { font-size: 0.75rem; color: #8b8984; font-weight: 700; }
        .setting-item input[type="number"], .setting-item select { background-color: #161512; border: 1px solid #3d3b36; color: #ffffff; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; outline: none; }
        .setting-checkbox { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #ffffff; height: 100%; padding-top: 18px; cursor: pointer; }
        .moves-line::-webkit-scrollbar { height: 6px; }
        .moves-line::-webkit-scrollbar-track { background: #1a1916; border-radius: 3px; }
        .moves-line::-webkit-scrollbar-thumb { background: #3d3b36; border-radius: 3px; }
        .moves-line::-webkit-scrollbar-thumb:hover { background: #62615e; }
        @media (max-width: 600px) { .config-box { flex-direction: column; } }

        /* 새로 추가된 UI CSS */
        .auth-bar { width: 780px; max-width: 100%; display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; }
        .auth-btn { background-color: #3880b6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .auth-btn:hover { background-color: #2c6896; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-card { background-color: #21201d; padding: 24px; border-radius: 8px; width: 320px; border: 1px solid #3d3b36; }
        .modal-input { width: 100%; background-color: #161512; border: 1px solid #3d3b36; color: #ffffff; padding: 10px; margin-bottom: 12px; border-radius: 4px; box-sizing: border-box; }
        .custom-option.disabled { color: #555555; cursor: not-allowed; }
        .custom-option.disabled::after { content: " (잠김)"; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="auth-bar">
    <span id="user-info-text" style="color: #8b8984;">로그인이 필요합니다.</span>
    <button class="auth-btn" id="login-trigger-btn">로그인</button>
</div>

<div class="config-box">
    <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
</div>

<div class="settings-container">
    <div class="custom-select-wrapper">
        <div class="custom-select" onclick="if(event.target.id !== 'settings-btn') toggleDropdown()">
            <span id="selected-preset">선택</span>
            <div>
                <span id="settings-btn" style="display: none; cursor: pointer; margin-right: 8px;" onclick="toggleSettings()">⚙️</span>
                <span>▼</span>
            </div>
        </div>
        <div class="custom-options" id="preset-options">
            <div class="custom-option" data-preset="Stockfish 19 Zero" onclick="applyPreset('Stockfish 19 Zero')">Stockfish 19 Zero</div>
            <div class="custom-option" data-preset="Stockfish 19 Instant" onclick="applyPreset('Stockfish 19 Instant')">Stockfish 19 Instant</div>
            <div class="custom-option" data-preset="Stockfish 19 Fast" onclick="applyPreset('Stockfish 19 Fast')">Stockfish 19 Fast</div>
            <div class="custom-option" data-preset="Stockfish 19 Lite" onclick="applyPreset('Stockfish 19 Lite')">Stockfish 19 Lite</div>
            <div class="custom-option" data-preset="Stockfish 19 Plus" onclick="applyPreset('Stockfish 19 Plus')">Stockfish 19 Plus</div>
            <div class="custom-option" data-preset="Stockfish 19 Pro" onclick="applyPreset('Stockfish 19 Pro')">Stockfish 19 Pro</div>
            <div class="custom-option" data-preset="Stockfish 19 Ultra" onclick="applyPreset('Stockfish 19 Ultra')">Stockfish 19 Ultra</div>
            <div class="custom-option" data-preset="Stockfish 19 Max" onclick="applyPreset('Stockfish 19 Max')">Stockfish 19 Max</div>
            <div class="custom-option" data-preset="Stockfish 19 Infinity" onclick="applyPreset('Stockfish 19 Infinity')">Stockfish 19 Infinity</div>
            <div class="custom-option" data-preset="Custom" onclick="applyPreset('Custom')">Custom</div>
        </div>
    </div>

    <div class="settings-grid" id="settings-grid-panel">
        <div class="setting-item">
            <label>Threads</label>
            <input type="number" id="opt-threads" value="1">
        </div>
        <div class="setting-item">
            <label>Hash</label>
            <input type="number" id="opt-hash" value="16">
        </div>
        <div class="setting-item">
            <label>Skill Level</label>
            <input type="number" id="opt-skill" value="20">
        </div>
        <div class="setting-item">
            <label>Move Overhead</label>
            <input type="number" id="opt-overhead" value="10">
        </div>
        <div class="setting-item" style="grid-column: span 2;">
            <label>Limit</label>
            <div style="display: flex; gap: 8px;">
                <select id="opt-limit-type" onchange="syncLimitToHidden()" style="flex: 1;">
                    <option value="time">Time</option>
                    <option value="depth" selected>Depth</option>
                    <option value="nodes">Nodes</option>
                    <option value="infinity">Infinite</option>
                </select>
                <input type="number" id="opt-limit-value" value="20" oninput="syncLimitToHidden()" style="flex: 1; min-width: 0;">
            </div>
        </div>
        <div class="setting-item">
            <label class="setting-checkbox">
                <input type="checkbox" id="opt-ponder"> Ponder
            </label>
        </div>
        <input type="hidden" id="opt-depth" value="20">
        <input type="hidden" id="opt-time" value="0">
        <input type="hidden" id="opt-nodes" value="0">
        <input type="checkbox" id="opt-infinity" style="display: none;">
    </div>
</div>

<div class="panel-container">
    <div class="top-row">
        <div class="left-controls">
            <div class="status-indicator" id="status-icon" onclick="toggleAnalysis()">▶</div>
            <div class="engine-title">Stockfish 19</div>
        </div>
        <div class="right-stats">
            <div class="stat-item"><span class="stat-label">EVAL</span><span class="stat-value" id="stat-eval">0.0</span></div>
            <div class="stat-item"><span class="stat-label">DEPTH</span><span class="stat-value" id="stat-depth">0</span></div>
            <div class="stat-item"><span class="stat-label">NODES</span><span class="stat-value" id="stat-nodes">0.00M</span></div>
            <div class="stat-item"><span class="stat-label">NPS</span><span class="stat-value" id="stat-nps">0.0 Mn/s</span></div>
        </div>
    </div>
    <div class="progress-timeline"><div id="fill-line" class="progress-timeline-fill"></div></div>
    <div class="bottom-row">
        <div class="eval-badge" id="badge-eval">0.00</div>
        <div class="moves-line" id="moves-output">Version: v2.2.1</div>
    </div>
</div>

<div id="auth-modal" class="modal-overlay">
    <div class="modal-card">
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; justify-content: center; border-bottom: 1px solid #3d3b36; padding-bottom: 0.5rem;">
            <span id="tab-login" style="cursor: pointer; font-weight: bold; color: #3880b6;">로그인</span>
            <span id="tab-register" style="cursor: pointer; font-weight: bold; color: #8b8984;">가입</span>
        </div>
        <input type="text" id="auth-id" placeholder="아이디" class="modal-input">
        <input type="password" id="auth-pw" placeholder="비밀번호" class="modal-input">
        <button id="auth-submit-btn" class="auth-btn" style="width: 100%; margin-bottom: 8px;">로그인</button>
        <button id="auth-close-btn" class="auth-btn" style="width: 100%; background-color: #2d2b27; color: #bababa;">닫기</button>
    </div>
</div>

<script>
    const presetRequirements = {
        'Stockfish 19 Zero': 0, 'Stockfish 19 Instant': 0, 'Stockfish 19 Fast': 0, 'Stockfish 19 Lite': 0, 'Custom': 0,
        'Stockfish 19 Plus': 1, 'Stockfish 19 Pro': 2, 'Stockfish 19 Ultra': 3, 'Stockfish 19 Max': 4, 'Stockfish 19 Infinity': 4
    };

    let currentUserTier = -1;
    let currentToken = localStorage.getItem('chess_token');

    let BASE_URL = "https://stockfish-analyzer.serveousercontent.com";
    let socket = null;
    
    let TARGET_DEPTH = 20; let IS_INFINITY = false; let IS_LOCAL_ROUTING = false; let currentMaxDepth = 0; let currentBestPvLength = 0; let localEngine = null;

    async function initServerConnection(retryCount = 0) {
        document.getElementById('user-info-text').innerText = "활성 서버를 탐색 중입니다...";
        let found = false;

        for (let i = 1; i <= 10; i++) {
            const suffix = i === 1 ? "" : i;
            const testUrl = `https://stockfish-analyzer${suffix}.serveousercontent.com`;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1500); 
                const res = await fetch(`${testUrl}/`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    BASE_URL = testUrl;
                    found = true;
                    console.log(`[연결 성공] ${BASE_URL} 에 연결되었습니다.`);
                    break;
                }
            } catch (e) {
            }
        }

        if (!found) {
            if (retryCount < 2) {
                document.getElementById('user-info-text').innerText = "서버가 부팅 중입니다. 잠시 후 재시도합니다...";
                setTimeout(() => initServerConnection(retryCount + 1), 3000);
                return;
            }
            document.getElementById('user-info-text').innerText = "현재 백엔드 서버가 꺼져있습니다.";
            return;
        }

        socket = io(BASE_URL, { transports: ['websocket'], perMessageDeflate: true });
        
        socket.on('analysis-progress', (data) => {
            document.getElementById('stat-depth').innerText = data.depth || 0;
            document.getElementById('stat-nodes').innerText = data.nodes ? (data.nodes / 1000000).toFixed(2) + 'M' : "0.00M";
            if (!IS_INFINITY) { document.getElementById('fill-line').style.width = Math.min(Math.round((data.depth / TARGET_DEPTH) * 100), 100) + '%'; }
            
            let scoreStr = String(data.score || "0.00");
            if (scoreStr !== "0.00" && !scoreStr.startsWith('-') && !scoreStr.startsWith('M')) scoreStr = '+' + scoreStr;
            document.getElementById('stat-eval').innerText = scoreStr; document.getElementById('badge-eval').innerText = scoreStr;
            if (data.pv) {
                const moves = Array.isArray(data.pv) ? data.pv : String(data.pv).trim().split(/\s+/);
                let html = ""; let moveNumber = 1;
                for (let i = 0; i < moves.length; i++) { if (i % 2 === 0) { html += `<span class="move-num">${moveNumber}.</span>`; moveNumber++; } html += `<span class="move-str">${moves[i]}</span>`; }
                document.getElementById('moves-output').innerHTML = html;
            }
        });
        
        socket.on('analysis-complete', (data) => {
            document.getElementById('status-icon').innerText = "▶";
            document.getElementById('status-icon').style.color = "#bababa";
            document.getElementById('fill-line').style.width = '100%';
            document.getElementById('fill-line').classList.remove('analyzing');
            if (data.status === 'error' && data.msg) alert(data.msg);
            fetchUserInfo();
        });

        fetchUserInfo();
    }

    async function fetchUserInfo() {
        if (!currentToken) return updateAuthUI(null);
        try {
            const res = await fetch(`${BASE_URL}/api/me`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
            if (res.ok) {
                const data = await res.json();
                currentUserTier = data.tier;
                updateAuthUI(data);
                updateDropdownUI();
            } else {
                currentToken = null; localStorage.removeItem('chess_token'); updateAuthUI(null);
            }
        } catch(e) { console.error(e); }
    }

    const tierNames = {0: "Free", 1: "Plus", 2: "Pro", 3: "Ultra", 4: "Max"};

    function updateAuthUI(user) {
        const infoText = document.getElementById('user-info-text');
        const loginBtn = document.getElementById('login-trigger-btn');
        if (user) {
            infoText.innerHTML = `<b>${user.account_id}</b> 님 [${tierNames[user.tier]} 등급] 잔여 노드: ${(user.remaining_nodes / 1000000).toFixed(1)}M`;
            loginBtn.textContent = "로그아웃";
            loginBtn.onclick = () => { currentToken = null; localStorage.removeItem('chess_token'); currentUserTier = -1; updateAuthUI(null); updateDropdownUI(); };
        } else {
            infoText.textContent = "로그인이 필요합니다.";
            loginBtn.textContent = "로그인";
            loginBtn.onclick = () => document.getElementById('auth-modal').style.display = 'flex';
        }
    }

    function updateDropdownUI() {
        document.querySelectorAll('.custom-option').forEach(opt => {
            const presetName = opt.dataset.preset;
            if (presetRequirements[presetName] > currentUserTier) {
                opt.classList.add('disabled');
            } else {
                opt.classList.remove('disabled');
            }
        });
    }

    fetchUserInfo();

    let authMode = "login";
    document.getElementById('tab-login').onclick = () => { authMode = "login"; document.getElementById('tab-login').style.color = '#3880b6'; document.getElementById('tab-register').style.color = '#8b8984'; document.getElementById('auth-submit-btn').textContent = '로그인'; };
    document.getElementById('tab-register').onclick = () => { authMode = "register"; document.getElementById('tab-register').style.color = '#3880b6'; document.getElementById('tab-login').style.color = '#8b8984'; document.getElementById('auth-submit-btn').textContent = '가입'; };
    document.getElementById('auth-close-btn').onclick = () => document.getElementById('auth-modal').style.display = 'none';
    
    document.getElementById('auth-submit-btn').onclick = async () => {
        const account_id = document.getElementById('auth-id').value;
        const password = document.getElementById('auth-pw').value;
        if (!account_id || !password) return alert("입력값을 확인하세요.");
        
        const endpoint = authMode === "login" ? "/api/login" : "/api/register";
        try {
            const res = await fetch(`${BASE_URL}${endpoint}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ account_id, password })
            });
            const data = await res.json();
            if (res.ok) {
                if (authMode === "register") {
                    alert("가입 완료. 로그인해주세요."); document.getElementById('tab-login').click();
                } else {
                    currentToken = data.token; localStorage.setItem('chess_token', currentToken);
                    document.getElementById('auth-modal').style.display = 'none';
                    fetchUserInfo();
                }
            } else { alert(data.detail || "오류가 발생했습니다."); }
        } catch(e) { alert("서버 통신 실패"); }
    };

    function parseLocalStockfishLine(line) {
        if (!line.startsWith("info") || !line.includes("depth")) return null;
        const depthMatch = line.match(/depth (\d+)/); const nodesMatch = line.match(/nodes (\d+)/); const npsMatch = line.match(/nps (\d+)/); const pvMatch = line.match(/ pv (.+)/);
        let score = "0.00";
        if (line.includes("score cp")) { const cpMatch = line.match(/score cp (-?\d+)/); if (cpMatch) score = (parseInt(cpMatch[1]) / 100).toFixed(2); } 
        else if (line.includes("score mate")) { const mateMatch = line.match(/score mate (-?\d+)/); if (mateMatch) score = "M" + mateMatch[1]; }
        if (depthMatch) { return { depth: parseInt(depthMatch[1]), nodes: nodesMatch ? parseInt(nodesMatch[1]) : 0, nps: npsMatch ? parseInt(npsMatch[1]) : 0, score: score, pv: pvMatch ? pvMatch[1] : "" }; }
        return null;
    }

    function toggleAnalysis() {
        if (!socket) return alert("서버에 연결하는 중입니다. 잠시만 기다려주세요.");
        const icon = document.getElementById('status-icon');
        if (icon.innerText === "▶") {
            requestAnalysis();
        } else {
            if (IS_LOCAL_ROUTING && localEngine) { localEngine.postMessage("stop"); } 
            else { socket.emit('stop-analysis'); fetchUserInfo(); }
            icon.innerText = "▶"; icon.style.color = "#bababa";
            document.getElementById('fill-line').classList.remove('analyzing');
        }
    }

    function requestAnalysis() {
        if (!currentToken) return alert("로그인 후 이용 가능합니다.");
        const selectedPreset = document.getElementById('selected-preset').innerText;
        if (presetRequirements[selectedPreset] > currentUserTier) return alert("이 요금제 등급에서는 사용할 수 없는 엔진입니다.");

        if (localEngine) { localEngine.postMessage("stop"); }
        socket.emit('stop-analysis');
        const fen = document.getElementById('fen-input').value;
        let optDepth = parseInt(document.getElementById('opt-depth').value);
        let optTime = parseInt(document.getElementById('opt-time').value);
        let optNodes = parseInt(document.getElementById('opt-nodes').value);
        IS_INFINITY = document.getElementById('opt-infinity').checked;

        if (isNaN(optDepth) || optDepth <= 0) optDepth = null; if (isNaN(optTime) || optTime <= 0) optTime = null; if (isNaN(optNodes) || optNodes <= 0) optNodes = null;
        if (!optDepth && !optTime && !optNodes) { IS_INFINITY = true; }
        if (IS_INFINITY) { optDepth = null; optTime = null; optNodes = null; }

        IS_LOCAL_ROUTING = IS_INFINITY || (optTime !== null && optTime > 10000);
        TARGET_DEPTH = optDepth || 20; currentMaxDepth = 0; currentBestPvLength = 0;
        
        document.getElementById('status-icon').innerText = "■"; document.getElementById('status-icon').style.color = "#3b82f6";
        document.getElementById('fill-line').style.width = IS_INFINITY ? '100%' : '0%';
        document.getElementById('fill-line').classList.add('analyzing');
        document.getElementById('moves-output').innerText = "Analyzing...";

        const analysisOptions = {
            token: currentToken,
            preset: selectedPreset,
            fen: fen, threads: parseInt(document.getElementById('opt-threads').value),
            hash: parseInt(document.getElementById('opt-hash').value), skillLevel: parseInt(document.getElementById('opt-skill').value),
            moveOverhead: parseInt(document.getElementById('opt-overhead').value), ponder: document.getElementById('opt-ponder').checked, infinity: IS_INFINITY
        };

        if (optDepth !== null) analysisOptions.targetDepth = optDepth;
        if (optTime !== null) analysisOptions.time = optTime;
        if (optNodes !== null) analysisOptions.nodes = optNodes;

        if (IS_LOCAL_ROUTING) {
            alert("로컬 라우팅은 데모 환경에서 비활성화 되어있습니다. 짧은 분석을 이용해주세요.");
            toggleAnalysis();
        } else {
            socket.emit('start-analysis', analysisOptions);
        }
    }

    socket.on('analysis-progress', (data) => {
        document.getElementById('stat-depth').innerText = data.depth || 0;
        document.getElementById('stat-nodes').innerText = data.nodes ? (data.nodes / 1000000).toFixed(2) + 'M' : "0.00M";
        if (!IS_INFINITY) { document.getElementById('fill-line').style.width = Math.min(Math.round((data.depth / TARGET_DEPTH) * 100), 100) + '%'; }
        
        let scoreStr = String(data.score || "0.00");
        if (scoreStr !== "0.00" && !scoreStr.startsWith('-') && !scoreStr.startsWith('M')) scoreStr = '+' + scoreStr;
        document.getElementById('stat-eval').innerText = scoreStr; document.getElementById('badge-eval').innerText = scoreStr;
        if (data.pv) {
            const moves = Array.isArray(data.pv) ? data.pv : String(data.pv).trim().split(/\s+/);
            let html = ""; let moveNumber = 1;
            for (let i = 0; i < moves.length; i++) { if (i % 2 === 0) { html += `<span class="move-num">${moveNumber}.</span>`; moveNumber++; } html += `<span class="move-str">${moves[i]}</span>`; }
            document.getElementById('moves-output').innerHTML = html;
        }
    });
    
    socket.on('analysis-complete', (data) => {
        document.getElementById('status-icon').innerText = "▶";
        document.getElementById('status-icon').style.color = "#bababa";
        document.getElementById('fill-line').style.width = '100%';
        document.getElementById('fill-line').classList.remove('analyzing');
        if (data.status === 'error' && data.msg) alert(data.msg);
        fetchUserInfo();
    });

    const presets = {
        'Stockfish 19 Zero': { threads: 1, hash: 8, skill: 20, overhead: 0, depth: 3, time: 10, nodes: 5000, ponder: false, infinity: false },
        'Stockfish 19 Instant': { threads: 1, hash: 16, skill: 20, overhead: 0, depth: 5, time: 100, nodes: 30000, ponder: false, infinity: false },
        'Stockfish 19 Fast': { threads: 1, hash: 32, skill: 20, overhead: 5, depth: 10, time: 1000, nodes: 100000, ponder: false, infinity: false },
        'Stockfish 19 Lite': { threads: 1, hash: 64, skill: 20, overhead: 5, depth: 10, time: 10000, nodes: 500000, ponder: false, infinity: false },
        'Stockfish 19 Plus': { threads: 2, hash: 128, skill: 20, overhead: 10, depth: 15, time: null, nodes: null, ponder: true, infinity: false },
        'Stockfish 19 Pro': { threads: 4, hash: 256, skill: 20, overhead: 15, depth: 20, time: null, nodes: null, ponder: true, infinity: false },
        'Stockfish 19 Ultra': { threads: 8, hash: 512, skill: 20, overhead: 20, depth: 25, time: null, nodes: null, ponder: true, infinity: false },
        'Stockfish 19 Max': { threads: 16, hash: 1024, skill: 20, overhead: 25, depth: 30, time: null, nodes: null, ponder: true, infinity: false },
        'Stockfish 19 Infinity': { threads: 32, hash: 1024, skill: 20, overhead: 30, depth: null, time: null, nodes: null, ponder: true, infinity: true }
    };

    function toggleDropdown() { document.getElementById('preset-options').classList.toggle('open'); }
    function toggleSettings() { const gp = document.getElementById('settings-grid-panel'); gp.style.display = (gp.style.display === 'none' || gp.style.display === '') ? 'grid' : 'none'; }
    function syncLimitToHidden() {
        const limitType = document.getElementById('opt-limit-type').value;
        const limitValue = document.getElementById('opt-limit-value').value;
        const limitInput = document.getElementById('opt-limit-value');
        document.getElementById('opt-depth').value = 0; document.getElementById('opt-time').value = 0; document.getElementById('opt-nodes').value = 0; document.getElementById('opt-infinity').checked = false;
        if (limitType === 'infinity') { limitInput.style.display = 'none'; document.getElementById('opt-infinity').checked = true; } 
        else { limitInput.style.display = 'block'; document.getElementById(`opt-${limitType}`).value = limitValue; }
    }

    function applyPreset(presetName) {
        if (presetRequirements[presetName] !== undefined && presetRequirements[presetName] > currentUserTier) {
            return;
        }
        document.getElementById('selected-preset').innerText = presetName;
        document.querySelector('.engine-title').innerText = presetName;
        const settingsBtn = document.getElementById('settings-btn');
        const gridPanel = document.getElementById('settings-grid-panel');
        if (presetName === 'Custom') { settingsBtn.style.display = 'inline-block'; syncLimitToHidden(); } 
        else {
            settingsBtn.style.display = 'none'; gridPanel.style.display = 'none';
            const config = presets[presetName];
            if (config) {
                document.getElementById('opt-threads').value = config.threads; document.getElementById('opt-hash').value = config.hash; document.getElementById('opt-skill').value = config.skill; document.getElementById('opt-overhead').value = config.overhead; document.getElementById('opt-ponder').checked = config.ponder; document.getElementById('opt-infinity').checked = config.infinity;
                document.getElementById('opt-depth').value = config.depth; document.getElementById('opt-time').value = config.time; document.getElementById('opt-nodes').value = config.nodes;
                if (config.infinity) { document.getElementById('opt-limit-type').value = 'infinity'; document.getElementById('opt-limit-value').style.display = 'none'; } 
                else if (config.time > 0) { document.getElementById('opt-limit-type').value = 'time'; document.getElementById('opt-limit-value').value = config.time; document.getElementById('opt-limit-value').style.display = 'block'; } 
                else if (config.nodes > 0) { document.getElementById('opt-limit-type').value = 'nodes'; document.getElementById('opt-limit-value').value = config.nodes; document.getElementById('opt-limit-value').style.display = 'block'; } 
                else { document.getElementById('opt-limit-type').value = 'depth'; document.getElementById('opt-limit-value').value = config.depth; document.getElementById('opt-limit-value').style.display = 'block'; }
            }
        }
        document.getElementById('preset-options').classList.remove('open');
    }
    
    document.addEventListener('click', function(event) {
        const wrapper = document.querySelector('.custom-select-wrapper');
        if (wrapper && !wrapper.contains(event.target)) {
            const options = document.getElementById('preset-options');
            if (options && options.classList.contains('open')) options.classList.remove('open');
        }
    });
    initServerConnection();
</script>
</body>
</html>
