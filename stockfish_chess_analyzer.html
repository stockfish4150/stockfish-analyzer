<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Live Analyzer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #161512;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .config-box {
            width: 780px;
            max-width: 100%;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
        }

        .config-box input {
            flex: 1;
            background-color: #21201d;
            border: 1px solid #3d3b36;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .config-box button {
            background-color: #81b64c;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .config-box button:hover {
            background-color: #95cc5b;
        }

        .panel-container {
            width: 780px;
            max-width: 100%;
            background-color: #21201d;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background-color: #21201d;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            background-color: #2d2b27;
            color: #bababa;
            width: 28px;
            height: 28px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .engine-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .engine-speed {
            background-color: #2d2b27;
            color: #b0b0b0;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-family: monospace;
        }

        .right-stats {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8b8984;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            font-family: monospace;
        }

        .progress-timeline {
            width: 100%;
            height: 3px;
            background-color: #2d2b27;
        }

        .progress-timeline-fill {
            height: 100%;
            width: 0%;
            background-color: #3880b6;
            transition: width 0.08s linear;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background-color: #1a1916;
            border-top: 1px solid #252420;
        }

        .eval-badge {
            background-color: #ffffff;
            color: #161512;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 3px;
            min-width: 48px;
            text-align: center;
            margin-right: 14px;
            font-family: monospace;
        }

        .moves-line {
            font-size: 0.9rem;
            color: #c3c2c0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .moves-line .move-num {
            color: #62615e;
            font-weight: 700;
            margin-right: 4px;
        }

        .moves-line .move-str {
            color: #ffffff;
            font-weight: 600;
            margin-right: 12px;
        }
    </style>
</head>
<body>

<div class="config-box">
    <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
    <button onclick="requestAnalysis()">분석 실행</button>
</div>

<div class="panel-container">
    <div class="top-row">
        <div class="left-controls">
            <div class="status-indicator" id="status-icon">■</div>
            <div class="engine-title">Stockfish 19 Analyze</div>
            <div class="engine-speed" id="stat-nps">0.0 Mn/s</div>
        </div>
        <div class="right-stats">
            <div class="stat-item">
                <span class="stat-label">EVAL</span>
                <span class="stat-value" id="stat-eval">0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DEPTH</span>
                <span class="stat-value" id="stat-depth">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">NODES</span>
                <span class="stat-value" id="stat-nodes">0.00M</span>
            </div>
        </div>
    </div>

    <div class="progress-timeline">
        <div id="fill-line" class="progress-timeline-fill"></div>
    </div>

    <div class="bottom-row">
        <div class="eval-badge" id="badge-eval">0.00</div>
        <div class="moves-line" id="moves-output">엔진 준비 완료. 분석 단추를 누르세요.</div>
    </div>
</div>

<script>
    const socket = io();
    const TARGET_DEPTH = 24;

    function requestAnalysis() {
        const fen = document.getElementById('fen-input').value;
        
        document.getElementById('status-icon').innerText = "▶";
        document.getElementById('status-icon').style.color = "#81b64c";
        document.getElementById('fill-line').style.width = '0%';
        document.getElementById('moves-output').innerText = "수 연산 중...";

        socket.emit('start-analysis', { fen: fen, targetDepth: TARGET_DEPTH });
    }

    socket.on('analysis-progress', (data) => {
        if (!data) return;

        // 진행률 업데이트
        const progressPercent = Math.min(Math.round((data.depth / TARGET_DEPTH) * 100), 100);
        document.getElementById('fill-line').style.width = progressPercent + '%';
        
        // 데이터 매핑 (NaN 방지 처리)
        document.getElementById('stat-depth').innerText = data.depth || 0;
        
        const nodesVal = data.nodes ? (data.nodes / 1000000).toFixed(2) : "0.00";
        document.getElementById('stat-nodes').innerText = nodesVal + 'M';

        const npsVal = data.nps ? (data.nps / 1000000).toFixed(1) : "0.0";
        document.getElementById('stat-nps').innerText = npsVal + ' Mn/s';

        // 평가 점수 부호 처리
        let scoreStr = data.score || "0.00";
        if (scoreStr !== "0.00" && !scoreStr.startsWith('-') && !scoreStr.startsWith('M')) {
            scoreStr = '+' + scoreStr;
        }
        document.getElementById('stat-eval').innerText = scoreStr;
        document.getElementById('badge-eval').innerText = scoreStr;

        if (data.pv) {
            document.getElementById('moves-output').innerHTML = parsePvToHtml(data.pv);
        }
    });

    socket.on('analysis-complete', (data) => {
        document.getElementById('status-icon').innerText = "■";
        document.getElementById('status-icon').style.color = "#bababa";
        document.getElementById('fill-line').style.width = '100%';
    });

    function parsePvToHtml(pvString) {
        if (!pvString) return "연산 중...";
        const moves = pvString.trim().split(/\s+/);
        let html = "";
        let moveNumber = 1;

        for (let i = 0; i < moves.length; i++) {
            if (i % 2 === 0) {
                html += `<span class="move-num">${moveNumber}.</span>`;
                moveNumber++;
            }
            html += `<span class="move-str">${moves[i]}</span>`;
        }
        return html;
    }
</script>
</body>
</html>
